# Secret scan: fails if a commit adds an API key, password or token.
#
# Runs gitleaks on the commits in every pull request and every push to main.
# Any secret it finds is redacted in the job summary and report, so a run on
# this public repository does not reveal it. A found secret must be revoked
# and replaced, because it is already public once pushed. The pre-commit hook
# in .pre-commit-config.yaml catches secrets before they are committed.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks scans commit history, not just the latest files.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No PR comments, so the workflow only needs read access.
          GITLEAKS_ENABLE_COMMENTS: "false"
          # Same gitleaks version as the pre-commit hook.
          GITLEAKS_VERSION: "8.30.1"
